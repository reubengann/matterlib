[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "matterlib"
version = "0.1.0"
description = "3D physics animation helper for JupyterLab using k3d + ipywidgets"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = [
  "k3d>=2.15.0",
  "ipywidgets>=8.0.0",
  "ipycanvas>=0.9.0",
  "numpy>=1.20.0",
  "jupyterlab>=4.5",
]

[tool.setuptools.packages.find]
where = ["."]
exclude = ["tests", "tests.*", "docs", "docs.*"]
